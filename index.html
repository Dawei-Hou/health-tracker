<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>健康报告管理 · Health Tracker</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234F46E5'/><path d='M16 23l-1-1C9.9 16.7 7 14 7 10.5A4.5 4.5 0 0 1 11.5 6c1.5 0 3 .7 4.5 2.1C17.5 6.7 19 6 20.5 6A4.5 4.5 0 0 1 25 10.5c0 3.5-2.9 6.2-8 11.5z' fill='white'/></svg>">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="健康管理">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#EEF2F9; --card:#FFFFFF; --primary:#2563EB; --primary-d:#1D4ED8;
  --normal:#16A34A; --caution:#D97706; --alert:#DC2626;
  --normal-bg:#ECFDF5; --caution-bg:#FFFBEB; --alert-bg:#FEF2F2;
  --text:#1E293B; --text-2:#64748B; --text-3:#94A3B8; --border:#E7ECF3;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05);
  --shadow:0 2px 8px rgba(16,24,40,.06),0 1px 2px rgba(16,24,40,.04);
  --shadow-lg:0 12px 28px rgba(16,24,40,.10),0 2px 6px rgba(16,24,40,.05);
  --radius:14px; --nav-w:224px;
  --c-biochem:#2563EB; --c-cbc:#E11D48; --c-hbv_panel:#7C3AED;
  --c-hbv_rna:#EA580C; --c-fibroscan:#0891B2; --c-ultrasound:#059669;
}
:root[data-theme="dark"]{
  --bg:#0F172A; --card:#1B2536; --border:#2C3A52;
  --text:#E5EAF2; --text-2:#9AA7BD; --text-3:#6B7A93;
  --normal-bg:#0E2A1E; --caution-bg:#2A2410; --alert-bg:#2E1517;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 2px 8px rgba(0,0,0,.45),0 1px 2px rgba(0,0,0,.35);
  --shadow-lg:0 12px 28px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
}
/* 暗色下覆盖硬编码的浅色表面 */
[data-theme="dark"] input,[data-theme="dark"] select,[data-theme="dark"] textarea,[data-theme="dark"] .inp{background:#131C2B;color:var(--text);border-color:var(--border)}
[data-theme="dark"] .btn-ghost{background:#28344A;color:#CBD5E1}
[data-theme="dark"] .btn-ghost:hover{background:#33425C;color:#fff}
[data-theme="dark"] .btn-danger{background:#3A1D1F;color:#FCA5A5}
[data-theme="dark"] .btn-danger:hover{background:#4A2427;color:#FECACA}
[data-theme="dark"] .jbtn,[data-theme="dark"] .rf-chip,[data-theme="dark"] .tchip,[data-theme="dark"] .rf-toggle,[data-theme="dark"] .hi-mk,[data-theme="dark"] .cat-chip,[data-theme="dark"] .badge,[data-theme="dark"] .card-title .badge{background:#28344A;color:#B8C4D8}
[data-theme="dark"] .jbtn.filled{background:#131C2B}
[data-theme="dark"] .cs-item,[data-theme="dark"] .ts-item,[data-theme="dark"] .tips-list li,[data-theme="dark"] .med-row,[data-theme="dark"] .tpl-box,[data-theme="dark"] .medchk,[data-theme="dark"] .show-row{background:#131C2B}
[data-theme="dark"] .show-row.on{background:#16223A}
[data-theme="dark"] .focus-chip{background:#28344A;color:#9AA7BD}
[data-theme="dark"] .focus-chip.on{background:#3A2E12;color:#FBBF24;border-color:#7A5A16}
[data-theme="dark"] .sm-card{background:#1B2536}
[data-theme="dark"] .sm-card.high{background:linear-gradient(180deg,#2A1618,#1B2536 60%)}
[data-theme="dark"] .sm-card.low{background:linear-gradient(180deg,#12233B,#1B2536 60%)}
[data-theme="dark"] .st-tab:hover{background:#28344A}
[data-theme="dark"] .score-ring{background:conic-gradient(var(--col) calc(var(--p)*1%),#2C3A52 0)}
[data-theme="dark"] .rec-filter{background:rgba(27,37,54,.92)}
[data-theme="dark"] .input-bar{background:rgba(27,37,54,.9)}
[data-theme="dark"] ::-webkit-scrollbar-thumb{background:#3A4A63}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-anchor:none}
html,body{height:100%}
body{
  font-family:'Noto Sans JP','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(124,58,237,.06), transparent 60%),
    radial-gradient(1000px 500px at -10% 10%, rgba(37,99,235,.07), transparent 55%),
    var(--bg);
  background-attachment:fixed;
  color:var(--text); font-size:14px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:8px;border:2px solid transparent;background-clip:padding-box}

/* ===== Layout ===== */
#app{display:flex;min-height:100vh}
#sidebar{
  width:var(--nav-w);
  background:linear-gradient(180deg,#1E293B,#0F172A);
  position:fixed;top:0;left:0;bottom:0;display:flex;flex-direction:column;z-index:100;
  box-shadow:4px 0 24px rgba(15,23,42,.12);
  padding-left:env(safe-area-inset-left,0);
  transition:width .22s ease;overflow:hidden;
}
/* 侧边栏折叠 */
#app.nav-collapsed{--nav-w:56px}
#app.nav-collapsed .brand-text,
#app.nav-collapsed .nav-item .nav-label,
#app.nav-collapsed .sidebar-foot{display:none}
#app.nav-collapsed .brand{padding:18px 10px;justify-content:center}
#app.nav-collapsed .nav-items{padding:10px 8px}
#app.nav-collapsed .nav-item{padding:10px;justify-content:center;gap:0}
#app.nav-collapsed .nav-item .ic{width:auto}
#main{transition:margin-left .22s ease}
.sb-edge-btn{position:fixed;top:50%;transform:translateY(-50%);left:calc(var(--nav-w) - 1px);width:16px;height:48px;background:#fff;border:1px solid var(--border);border-left:none;border-radius:0 8px 8px 0;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:102;box-shadow:3px 1px 6px rgba(0,0,0,.08);transition:left .22s ease,background .15s;padding:0}
.sb-edge-btn:hover{background:#EFF6FF}
.sb-edge-btn svg{transition:transform .22s ease}
#app.nav-collapsed .sb-edge-btn svg{transform:rotate(180deg)}
.brand{padding:22px 20px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.brand .logo{width:34px;height:34px;background:linear-gradient(135deg,#3B82F6,#8B5CF6);border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 4px 12px rgba(59,130,246,.4);flex-shrink:0}
.brand .logo svg{width:19px;height:19px}
.brand small{display:block;font-size:10px;font-weight:500;color:#94A3B8;letter-spacing:.5px}
.nav-items{flex:1;padding:14px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#CBD5E1;font-weight:500;font-size:14px;transition:.18s;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 4px 14px rgba(37,99,235,.4)}
.nav-item .ic{width:20px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.nav-item .ic svg{width:19px;height:19px;display:block}
.sidebar-foot{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#64748B;line-height:1.6}

#main{flex:1;margin-left:var(--nav-w);padding:28px 34px 96px;max-width:1200px}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h1{font-size:23px;font-weight:800;letter-spacing:-.3px}
.topbar h1 .sub{font-size:13px;font-weight:500;color:var(--text-3);margin-left:8px}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Buttons ===== */
.btn{padding:9px 16px;border-radius:10px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;transition:.16s;border:1px solid transparent;white-space:nowrap}
.btn-primary{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}
.btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);box-shadow:0 6px 16px rgba(37,99,235,.34)}
.btn-ghost{background:#EEF2F9;color:#42506A;border-color:transparent}
.btn-ghost:hover{background:#E1E8F3;color:#1E293B}
.btn-danger{background:#FCE8E8;color:#DC2626;border-color:transparent}
.btn-danger:hover{background:#F8D5D5;color:#B91C1C}
.btn-sm{padding:7px 12px;font-size:12px}
.btn svg{width:15px;height:15px;flex-shrink:0}
.btn-sm svg{width:14px;height:14px}

/* ===== Cards ===== */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px 22px;margin-bottom:18px;border:1px solid rgba(231,236,243,.7)}
.card-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card-title .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:#EFF3FA;color:var(--text-2)}
.card-title .dot{width:9px;height:9px;border-radius:3px;background:var(--primary)}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#1D4ED8 0%,#4F46E5 55%,#7C3AED 100%);color:#fff;border-radius:20px;padding:26px 28px;margin-bottom:20px;box-shadow:0 16px 40px rgba(79,70,229,.32)}
.hero::before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:radial-gradient(circle,rgba(255,255,255,.16),transparent 70%);border-radius:50%}
.hero .date-line{font-size:13px;opacity:.95;margin-bottom:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;position:relative}
.hero .stat-row{display:flex;gap:14px;flex-wrap:wrap;position:relative}
.hero .stat{background:rgba(255,255,255,.16);border-radius:14px;padding:14px 22px;min-width:100px;backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14)}
.hero .stat .n{font-size:30px;font-weight:800;line-height:1}
.hero .stat .l{font-size:12px;opacity:.92;margin-top:6px;font-weight:500}
.abn-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;position:relative}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:20px;font-size:12.5px;font-weight:600}
.hero .chip{background:rgba(255,255,255,.92);color:#B91C1C}
.hero .chip.low{color:#1D4ED8}
.chip.high{background:var(--alert-bg);color:var(--alert)}
.chip.low{background:#EFF6FF;color:var(--primary)}
.chip .arw{font-weight:800}

/* ===== Assessment ===== */
.assess-card{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.score-box{text-align:center}
.score-ring{width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--col) calc(var(--p)*1%),#E9EEF5 0);display:flex;align-items:center;justify-content:center}
.score-inner{width:80px;height:80px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #EEF2F7}
.score-n{font-size:30px;font-weight:800;line-height:1}
.score-lv{font-size:12px;font-weight:700;margin-top:2px}
.score-cap{font-size:12px;color:var(--text-3);margin-top:8px;font-weight:600}
.assess-right{flex:1;min-width:260px}
.recheck-line{font-size:14px;font-weight:600;margin-bottom:12px}
.recheck-cfg{font-size:11px;color:var(--text-3);font-weight:500}
.tips-title{font-size:13px;font-weight:700;color:var(--caution);margin-bottom:6px}
.tips-list{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
.tips-list li{font-size:12.5px;color:var(--text-2);padding:6px 11px;background:#F8FAFC;border-radius:8px;border-left:3px solid var(--border)}
.tips-ok{font-size:14px;color:var(--normal);font-weight:700;padding:12px;background:var(--normal-bg);border-radius:10px}
.tips-note{font-size:11px;color:var(--text-3);margin-top:10px}

/* ===== Small multiples ===== */
.sm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:11px}
.sm-card{border:1px solid var(--border);border-radius:12px;padding:9px 12px 8px;cursor:pointer;transition:.16s;background:var(--card);position:relative;overflow:hidden}
.sm-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--normal)}
.sm-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px)}
.sm-card.high::before{background:var(--alert)}
.sm-card.low::before{background:var(--primary)}
.sm-card.high{background:linear-gradient(180deg,#FEF2F2,#fff 60%)}
.sm-card.low{background:linear-gradient(180deg,#EFF6FF,#fff 60%)}
.sm-card .sm-tag{font-size:10px;font-weight:700;display:flex;align-items:center;gap:4px;padding-left:4px;margin-bottom:1px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm-card .sm-tag .dot{width:6px;height:6px;border-radius:2px;flex-shrink:0}
.sm-card .k{font-size:12px;color:var(--text-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.sm-card .v{font-size:19px;font-weight:800;margin:2px 0 1px;display:flex;align-items:baseline;gap:4px;padding-left:4px}
.sm-card .v .u{font-size:10px;font-weight:600;color:var(--text-3)}
.sm-card .v .arw{font-size:14px}
.sm-card.high .v{color:var(--alert)}
.sm-card.low .v{color:var(--primary)}
.spark-box{position:relative;height:30px;width:100%;margin-top:2px}
.spark-box canvas{position:absolute;inset:0}

/* ===== Table ===== */
.tbl-wrap{overflow-x:auto;border-radius:10px;-webkit-overflow-scrolling:touch}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
table.data th{font-weight:600;color:var(--text-2);font-size:12px;position:sticky;top:0;background:#F8FAFC}
table.data td.val{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
table.data td.val.high{color:var(--alert)}
table.data td.val.low{color:var(--primary)}
table.data td.ref{color:var(--text-3);font-size:12px}
table.data tr:hover td{background:#F8FAFC}
.st-pill{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px}
.st-pill.high{background:var(--alert-bg);color:var(--alert)}
.st-pill.low{background:#EFF6FF;color:var(--primary)}
.st-pill.normal{background:var(--normal-bg);color:var(--normal)}
.cat-head{font-size:13px;font-weight:700;padding:14px 4px 8px;display:flex;align-items:center;gap:8px}
.cat-head .dot{width:9px;height:9px;border-radius:3px}

/* ===== Trend ===== */
.trend-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select,.inp{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);box-shadow:var(--shadow-sm)}
.trend-ctrl select{min-width:150px}
.tg{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:600;cursor:pointer;padding:8px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card)}
.tg input{accent-color:var(--primary)}
.tg-abn input{accent-color:var(--alert)}
.trend-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.tchip{position:relative;font-size:12.5px;font-weight:600;padding:7px 13px;border-radius:9px;background:#F1F5F9;color:var(--text-2);border:1px solid transparent;transition:.15s;white-space:nowrap}
.tchip:hover{background:#E2E8F0;color:var(--text)}
.tchip.active{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 3px 9px rgba(37,99,235,.28)}
.tchip .tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--alert);margin-left:5px;vertical-align:middle}
.tchip.active .tdot{background:#fff}
.trend-chart-wrap{position:relative;height:360px;width:100%;overflow:hidden}
.trend-chart-wrap canvas{position:absolute;inset:0}
.trend-summary{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:16px;padding-top:16px;border-top:1px dashed var(--border)}
.trend-summary .ts-item{background:#F8FAFC;border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.trend-summary .ts-l{font-size:11px;color:var(--text-3);font-weight:600;margin-bottom:4px}
.trend-summary .ts-v{font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:4px}
.trend-summary .ts-v.high{color:var(--alert)}
.trend-summary .ts-v.low{color:var(--primary)}
.trend-summary .ts-v.normal{color:var(--normal)}
.trend-summary .ts-u{font-size:10px;font-weight:600;color:var(--text-3)}
.trend-summary .ts-ref{font-size:12.5px;font-weight:700;color:var(--text-2)}
.trend-summary .ts-empty{grid-column:1/-1;color:var(--text-3);font-size:13px;text-align:center;padding:8px}

/* ===== 连续异常预警 ===== */
.consec-banner{background:linear-gradient(135deg,#FEF2F2,#FFF7ED);border:1px solid #FECACA;border-left:5px solid var(--alert);border-radius:14px;padding:14px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm)}
.consec-banner .cb-head{font-size:14px;font-weight:800;color:var(--alert);margin-bottom:10px}
.consec-banner .cb-items{display:flex;flex-wrap:wrap;gap:7px}
.ca-chip{font-size:12.5px;font-weight:600;padding:5px 11px;border-radius:20px;background:#fff;border:1px solid #FECACA;color:var(--alert)}
.ca-chip.low{border-color:#BFDBFE;color:var(--primary)}
.ca-chip b{font-weight:800}

/* ===== 临床评分 ===== */
.cs-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.cs-item{background:#F8FAFC;border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.cs-item .cs-n{font-size:28px;font-weight:800;line-height:1}
.cs-item .cs-l{font-size:12px;color:var(--text-2);font-weight:700;margin-top:6px}
.cs-item .cs-d{font-size:11.5px;margin-top:3px;color:var(--text-3);font-weight:600}
.cs-note{font-size:12px;color:var(--text-3);margin-top:12px;padding-top:11px;border-top:1px dashed var(--border);line-height:1.6}

/* ===== 乙肝五项判读 ===== */
.hbv-interp{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:var(--shadow-sm);border-left:5px solid var(--c-hbv_panel)}
.hbv-interp .hi-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hbv-interp .hi-badge{font-size:16px;font-weight:800;color:#fff;background:var(--c-hbv_panel);padding:5px 14px;border-radius:20px}
.hbv-interp .hi-badge.warn{background:var(--caution)}
.hbv-interp .hi-badge.danger{background:var(--alert)}
.hbv-interp .hi-badge.ok{background:var(--normal)}
.hbv-interp .hi-title{font-size:13px;font-weight:700;color:var(--text-2)}
.hbv-interp .hi-desc{font-size:12.5px;color:var(--text-2);line-height:1.65}
.hbv-interp .hi-pattern{display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.hbv-interp .hi-mk{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:7px;background:#F1F5F9;color:var(--text-2)}
.hbv-interp .hi-mk.pos{background:var(--alert-bg);color:var(--alert)}
.hbv-interp .hi-mk.neg{background:#F1F5F9;color:var(--text-3)}

/* ===== 暗色模式切换按钮 ===== */
.dark-toggle{margin:0 12px 8px;color:#CBD5E1}
.dark-toggle:hover{background:rgba(255,255,255,.07);color:#fff}

/* ===== Input ===== */
.input-bar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:var(--shadow)}
.input-bar .jump{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.jbtn{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:6px 11px;border-radius:8px;background:#F1F5F9;color:var(--text-3);border:1px solid transparent;transition:.15s;white-space:nowrap}
.jbtn:hover{background:#E2E8F0;color:var(--text)}
.jbtn .jdot{width:8px;height:8px;border-radius:50%;border:1.5px solid;flex-shrink:0}
.jbtn.filled{background:#fff;color:var(--text);border-color:var(--border);box-shadow:var(--shadow-sm)}
.jbtn .f{display:inline-block;min-width:16px;text-align:center;background:#E2E8F0;color:var(--text-2);border-radius:10px;font-size:10px;padding:0 5px}
.jbtn.filled .f{background:var(--primary);color:#fff}
.jbtn .n{display:inline-block;min-width:16px;text-align:center;background:var(--alert);color:#fff;border-radius:10px;font-size:10px;padding:0 5px}
.sec{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;border:1px solid rgba(231,236,243,.7)}
.sec-head{padding:14px 18px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;border-left:5px solid var(--primary);cursor:pointer;user-select:none}
.sec-head .cnt{font-size:11px;font-weight:600;color:var(--text-3);margin-left:auto}
.sec-head .chev{transition:.2s;color:var(--text-3)}
.sec.collapsed .sec-body{display:none}
.sec.collapsed .chev{transform:rotate(-90deg)}
.sec-body{padding:8px 18px 18px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:12.5px;font-weight:600;color:var(--text-2);display:flex;justify-content:space-between;gap:6px}
.fld label .nm{min-width:0}
.fld label .ref{color:var(--text-3);font-weight:500;font-size:11px;white-space:nowrap;margin-left:auto;flex-shrink:0}
.fld input,.fld select,.fld textarea{padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:#FBFCFE;width:100%;transition:.15s}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.fld input.high{border-color:var(--alert);color:var(--alert);font-weight:700;background:var(--alert-bg)}
.fld input.low{border-color:var(--primary);color:var(--primary);font-weight:700;background:#EFF6FF}
.fld .live{font-size:11px;font-weight:700;min-height:14px}
.fld .live.high{color:var(--alert)}
.fld .live.low{color:var(--primary)}
.fld .live.normal{color:var(--normal)}
.med-checks{display:flex;flex-wrap:wrap;gap:8px}
.medchk{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--border);border-radius:10px;font-size:13px;font-weight:500;cursor:pointer;transition:.15s;background:#FBFCFE}
.medchk:hover{border-color:#7DD3FC}
.medchk.on{background:#E0F2FE;border-color:#38BDF8;color:#0369A1;font-weight:600}
.medchk .dose,.medchk .usage{font-size:11px;color:#0284C7;background:rgba(255,255,255,.7);padding:1px 6px;border-radius:10px}
.medchk input{accent-color:#0EA5E9}

/* ===== Records ===== */
#recFilter{position:sticky;top:0;z-index:30;margin-bottom:16px}
.rec-filter{background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:11px}
.rf-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rf-lb{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:700;color:var(--text-2)}
.rf-lb svg{width:14px;height:14px}
.rf-chips{display:flex;gap:6px;flex-wrap:wrap}
.rf-chip{font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;background:#F1F5F9;color:var(--text-2);border:1px solid transparent;transition:.15s}
.rf-chip:hover{background:#E2E8F0}
.rf-chip.active{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 3px 9px rgba(37,99,235,.28)}
.rf-dates{display:flex;align-items:center;gap:7px}
.rf-date{padding:6px 9px;font-size:12.5px;width:auto}
.rf-sel{padding:7px 10px;font-size:12.5px;width:auto;min-width:120px}
.rf-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--text-2);padding:7px 12px;border-radius:8px;background:#F1F5F9;cursor:pointer;transition:.15s}
.rf-toggle input{accent-color:var(--alert)}
.rf-toggle.on{background:var(--alert-bg);color:var(--alert)}
.rf-summary{font-size:12px;color:var(--text-3);font-weight:500}
.rf-summary b{color:var(--text);font-weight:800}
.rec-card{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;transition:.16s;flex-wrap:wrap;gap:10px;box-shadow:var(--shadow-sm)}
.rec-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-1px)}
.rec-card .rec-date{font-size:16px;font-weight:800}
.rec-card .rec-meta{font-size:12px;color:var(--text-2);margin-top:3px;max-width:520px}
.rec-card .rec-abn{font-size:12px;color:var(--alert);font-weight:700;background:var(--alert-bg);padding:4px 10px;border-radius:20px}
.rec-card .rec-ok{font-size:12px;color:var(--normal);font-weight:700;background:var(--normal-bg);padding:4px 10px;border-radius:20px}

/* ===== Settings ===== */
.tag-list{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;gap:6px;background:#ECFDF5;color:#047857;font-size:13px;font-weight:600;padding:6px 8px 6px 12px;border-radius:20px;border:1px solid #A7F3D0}
.tag .tag-doc{font-size:11px;font-weight:600;color:#0E7490;background:#CFFAFE;padding:1px 7px;border-radius:10px}
.tag button{color:#059669;font-weight:800;font-size:15px;line-height:1;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.tag button:hover{background:#059669;color:#fff}
.cat-chip-grid{display:flex;flex-wrap:wrap;gap:8px;min-height:40px}
.cat-chip{display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px;background:#F8FBFF;border:1px solid var(--border);border-radius:9px;cursor:grab;user-select:none;touch-action:none;transition:transform .12s,box-shadow .12s,border-color .12s}
.cat-chip:hover{border-color:var(--primary);box-shadow:var(--shadow-sm)}
.cat-chip:active{cursor:grabbing}
.cat-chip.dragging{opacity:.4}
.cat-chip.drop-target{border-color:var(--primary);border-style:dashed;background:#EFF6FF;transform:scale(1.03)}
.cat-chip-grip{color:var(--text-3);font-size:13px;line-height:1;letter-spacing:-2px;cursor:grab}
.cat-chip-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cat-chip-name{font-size:13.5px;font-weight:600;color:var(--text-1);white-space:nowrap}
.date-cal-wrap{position:relative;display:flex;align-items:center}
.date-cal-wrap input[type=text]{flex:1;padding-right:38px}
.date-cal-btn{position:absolute;right:8px;background:none;border:none;cursor:pointer;padding:4px;color:var(--text-2);display:flex;align-items:center;border-radius:6px;transition:.15s}
.date-cal-btn:hover{color:var(--primary);background:#EFF6FF}
.med-row{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:#F8FBFF;gap:10px;flex-wrap:wrap}
.med-row.editing{border-color:#38BDF8;background:#F0F9FF;box-shadow:0 0 0 3px rgba(56,189,248,.15)}
.med-row .dose{font-size:12px;font-weight:600;color:#0284C7;background:#E0F2FE;padding:2px 8px;border-radius:12px;margin-left:4px}
.med-row .usage{font-size:12px;font-weight:600;color:#7C3AED;background:#F3E8FF;padding:2px 8px;border-radius:12px;margin-left:4px}
.tpl-box{border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;background:#FCFCFF}
.tpl-head{display:flex;gap:10px;margin-bottom:10px}
.tpl-name{flex:1;font-weight:700}
.cc-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.cc-add .inp{flex:1;min-width:80px}
.cc-add .inp[data-f="unit"]{max-width:100px}
.cc-add .inp[data-f="min"],.cc-add .inp[data-f="max"]{max-width:90px}
.cc-add .inp[data-f="decimals"]{max-width:76px}
/* 设定二级标签 */
.settings-tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;margin-bottom:18px;box-shadow:var(--shadow-sm);position:sticky;top:0;z-index:20}
.st-tab{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 12px;border-radius:10px;font-size:13.5px;font-weight:600;color:var(--text-2);transition:.16s;white-space:nowrap}
.st-tab:hover{background:#F1F5F9;color:var(--text)}
.st-tab.active{background:linear-gradient(135deg,var(--primary),#4F46E5);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28)}
.st-tab .st-ic{font-size:15px}
.settings-panel{animation:fade .2s ease}
/* 重点指标设置 */
.focus-cat{margin-bottom:14px}
.focus-cat:last-child{margin-bottom:0}
.focus-cat-t{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:7px;margin-bottom:8px;padding-bottom:6px;border-bottom:1px dashed var(--border)}
.focus-cat-t .dot{width:8px;height:8px;border-radius:3px}
.focus-chips{display:flex;flex-wrap:wrap;gap:7px}
.focus-chip{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:9px;background:#F1F5F9;color:var(--text-3);border:1px solid transparent;transition:.15s}
.focus-chip:hover{background:#E2E8F0;color:var(--text-2)}
.focus-chip.on{background:#FEF3C7;color:#B45309;border-color:#FCD34D}
/* 概览页模块显隐 */
.show-list{display:flex;flex-direction:column;gap:9px}
.show-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;background:#F8FAFC;cursor:pointer;transition:.15s}
.show-row.on{background:#F0F5FF;border-color:#BFDBFE}
.show-row .show-t{font-size:13.5px;font-weight:700;color:var(--text)}
.show-row .show-d{font-size:11.5px;color:var(--text-3);margin-top:2px}
.show-row input{width:18px;height:18px;accent-color:var(--primary);flex-shrink:0}
/* 设定页专属：紧凑表单（短字段变窄，长字段跨列） */
.settings-panel .form-grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.settings-panel .fld.wide{grid-column:span 2}
/* 患者基础信息：桌面 1 行 6 列，平板 4 列，手机 3 列 */
.settings-panel .form-grid.profile-grid{grid-template-columns:repeat(6,1fr);gap:12px}
@media(max-width:1080px){.settings-panel .form-grid.profile-grid{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){.settings-panel .form-grid.profile-grid{grid-template-columns:repeat(3,1fr)}}

/* ===== Modal ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:1000;padding:16px;backdrop-filter:blur(3px)}
.modal-mask.show{display:flex}
.modal{background:var(--card);border-radius:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:26px;box-shadow:var(--shadow-lg);-webkit-overflow-scrolling:touch}
.modal h3{font-size:18px;font-weight:800;margin-bottom:14px}

/* ===== Empty / warn ===== */
.empty{text-align:center;padding:56px 20px;color:var(--text-3)}
.empty .ic{font-size:44px;margin-bottom:12px}
.warn-banner{background:linear-gradient(135deg,#FFFBEB,#FEF9E7);border:1px solid #FDE68A;color:#92400E;padding:13px 16px;border-radius:12px;margin-bottom:18px;font-size:13px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap;box-shadow:var(--shadow-sm)}

/* ===== Bottom nav ===== */
#bottomnav{display:none}

/* ===== Views ===== */
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ===== Responsive ===== */
@media(max-width:768px){
  #sidebar{display:none}
  .sb-edge-btn{display:none}
  #main{margin-left:0;padding:16px max(14px,env(safe-area-inset-right)) 84px max(14px,env(safe-area-inset-left));max-width:100%}
  .topbar h1{font-size:20px}
  .topbar .actions{width:100%}
  .topbar .actions .btn{flex:1;justify-content:center}
  #bottomnav{
    display:flex;position:fixed;bottom:0;left:0;right:0;
    background:rgba(255,255,255,.94);backdrop-filter:blur(12px);
    border-top:1px solid var(--border);z-index:100;padding:6px 4px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
    padding-left:max(4px,env(safe-area-inset-left));padding-right:max(4px,env(safe-area-inset-right));
    box-shadow:0 -4px 20px rgba(16,24,40,.08);
  }
  #bottomnav .nav-item{flex-direction:column;gap:3px;padding:6px 2px;font-size:10.5px;border-radius:10px;justify-content:center;color:var(--text-3)}
  #bottomnav .nav-item.active{background:transparent;color:var(--primary);box-shadow:none}
  #bottomnav .nav-item .ic{width:auto}
  #bottomnav .nav-item .ic svg{width:22px;height:22px}
  .hero{padding:20px}
  .hero .stat{flex:1;min-width:82px;padding:12px 14px}
  .hero .stat .n{font-size:26px}
  .assess-card{gap:16px}
  .score-ring{width:92px;height:92px}
  .score-inner{width:70px;height:70px}
  .score-n{font-size:26px}
  .assess-right{min-width:0}
  .tips-list{grid-template-columns:1fr}
  .sm-grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .form-grid{grid-template-columns:1fr}
  input,select,textarea,.inp,.fld input{font-size:16px}
  .modal{padding:20px 18px;border-radius:16px}
  .rec-card{padding:14px}
  .rec-card .rec-meta{max-width:100%}
  .cc-add{flex-direction:column;align-items:stretch}
  .cc-add .inp{max-width:100%!important}
  .input-bar .jump{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch}
  .settings-tabs{gap:3px;padding:4px}
  .st-tab{flex-direction:column;gap:3px;padding:8px 4px;font-size:11px}
  .st-tab .st-ic{font-size:17px}
  .settings-panel .form-grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .settings-panel .fld.wide{grid-column:span 2}
}
@media (orientation:landscape) and (max-height:500px){
  #main{padding-left:max(20px,env(safe-area-inset-left));padding-right:max(20px,env(safe-area-inset-right))}
}
@media print{
  #sidebar,#bottomnav,.topbar .actions,.trend-ctrl,.input-bar{display:none!important}
  #main{margin:0;padding:0}
  body{background:#fff}
  .card,.sec{box-shadow:none;border:1px solid var(--border);break-inside:avoid}
}
</style>
</head>
<body>
<div id="app">
  <nav id="sidebar">
    <div class="brand"><span class="logo" data-ic="heart"></span> <div class="brand-text">健康报告<small>HEALTH TRACKER</small></div></div>
    <div class="nav-items">
      <button class="nav-item active" data-view="dashboard"><span class="ic" data-ic="grid"></span><span class="nav-label"> 概览</span></button>
      <button class="nav-item" data-view="trend"><span class="ic" data-ic="trend"></span><span class="nav-label"> 趋势分析</span></button>
      <button class="nav-item" data-view="records"><span class="ic" data-ic="folder"></span><span class="nav-label"> 报告记录</span></button>
      <button class="nav-item" data-view="input"><span class="ic" data-ic="edit"></span><span class="nav-label"> 录入报告</span></button>
      <button class="nav-item" data-view="settings"><span class="ic" data-ic="settings"></span><span class="nav-label"> 设定</span></button>
    </div>
    <button class="nav-item dark-toggle" onclick="App.toggleDark()"><span class="ic" id="darkToggleIc" data-ic="moon"></span><span class="nav-label" id="darkToggleLbl"> 暗色模式</span></button>
    <div class="sidebar-foot">💾 数据保存在本机浏览器<br>请定期「导出JSON」备份</div>
  </nav>
  <button class="sb-edge-btn" onclick="App.toggleSidebar()" title="折叠/展开侧边栏">
    <svg viewBox="0 0 24 24" fill="none" stroke="#94A3B8" stroke-width="2.5" width="12" height="12"><polyline points="15 18 9 12 15 6"/></svg>
  </button>

  <main id="main">
    <!-- Dashboard -->
    <section class="view active" id="view-dashboard">
      <div class="topbar">
        <h1>健康概览</h1>
        <div class="actions">
          <button class="btn btn-primary btn-sm" onclick="App.go('input')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建报告</button>
        </div>
      </div>
      <div id="exportWarn"></div>
      <div id="heroBox"></div>
      <div id="consecAlert"></div>
      <div id="hbvInterpret"></div>
      <div class="card" id="focusCard">
        <div class="card-title"><span class="dot"></span>重点指标趋势 <span class="badge" id="smCount"></span></div>
        <div id="smGrid"></div>
      </div>
    </section>

    <!-- Trend -->
    <section class="view" id="view-trend">
      <div class="topbar"><h1>趋势分析 <span class="sub">各指标经时变化</span></h1></div>
      <div class="card">
        <div class="trend-ctrl">
          <select id="trendCat" onchange="App.onTrendCatChange()"></select>
          <select id="trendRange" onchange="App.renderTrend()" title="时间段">
            <option value="0">全部时间</option>
            <option value="1">近 1 年</option>
            <option value="3">近 3 年</option>
            <option value="5">近 5 年</option>
            <option value="7">近 7 年</option>
            <option value="10">近 10 年</option>
          </select>
          <label class="tg"><input type="checkbox" id="trendLabels" checked onchange="App.renderTrend()"> 显示数值</label>
          <label class="tg tg-abn"><input type="checkbox" id="trendAbnOnly" checked onchange="App.onTrendAbnToggle()"> 仅异常指标</label>
        </div>
        <div id="trendChips" class="trend-chips"></div>
        <div class="trend-chart-wrap"><canvas id="trendChart"></canvas></div>
        <div id="trendSummary" class="trend-summary"></div>
      </div>
    </section>

    <!-- Records -->
    <section class="view" id="view-records">
      <div class="topbar">
        <h1>报告记录</h1>
        <div class="actions">
          <button class="btn btn-ghost btn-sm" onclick="App.exportExcel()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
            导出 Excel
          </button>
          <button class="btn btn-primary btn-sm" onclick="App.go('input')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建报告</button>
        </div>
      </div>
      <div id="recFilter"></div>
      <div id="recList"></div>
    </section>

    <!-- Input -->
    <section class="view" id="view-input">
      <div class="topbar"><h1 id="inputTitle">录入新报告</h1></div>
      <div id="inputForm"></div>
    </section>

    <!-- Settings -->
    <section class="view" id="view-settings">
      <div class="topbar"><h1>设定 <span class="sub">患者信息 · 机构 · 药物 · 自定义类别</span></h1></div>
      <div id="settingsBody"></div>
    </section>
  </main>
</div>

<nav id="bottomnav">
  <button class="nav-item active" data-view="dashboard"><span class="ic" data-ic="grid"></span>概览</button>
  <button class="nav-item" data-view="trend"><span class="ic" data-ic="trend"></span>趋势</button>
  <button class="nav-item" data-view="records"><span class="ic" data-ic="folder"></span>记录</button>
  <button class="nav-item" data-view="input"><span class="ic" data-ic="edit"></span>录入</button>
  <button class="nav-item" data-view="settings"><span class="ic" data-ic="settings"></span>设定</button>
</nav>

<div class="modal-mask" id="modalMask" onclick="if(event.target===this)App.closeModal()">
  <div class="modal" id="modalBody"></div>
</div>
